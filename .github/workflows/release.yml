name: Release (.deb)

# Trigger manual via Actions tab. Pede só versão.
# A branch é a escolhida no dropdown "Use workflow from" do GitHub (github.ref_name).
# Cria tag v<version>, faz build do binário (amd64 + arm64),
# empacota em .deb e publica como GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem prefixo "v"). Ex: 0.1.0'
        required: true
        type: string

permissions:
  contents: write   # criar tag + release

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout (${{ github.ref_name }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary (linux/${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ inputs.version }}" \
            -o erp24 .
          file erp24
          ls -lh erp24

      - name: Build .deb
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          PKG="erp24_${VERSION}_${ARCH}"
          mkdir -p "$PKG/DEBIAN" \
                   "$PKG/usr/sbin" \
                   "$PKG/etc/erp24" \
                   "$PKG/usr/share/doc/erp24"

          # binário
          install -m 755 erp24 "$PKG/usr/sbin/erp24"

          # config exemplo (NÃO sobrescreve config.yaml em re-installs)
          install -m 644 config.example.yaml "$PKG/etc/erp24/config.example.yaml"

          # docs
          install -m 644 README.md "$PKG/usr/share/doc/erp24/README.md"

          # control
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: erp24
          Version: ${VERSION}
          Section: admin
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: erp24 maintainers <noreply@example.com>
          Depends: systemd
          Recommends: ca-certificates, curl
          Description: Linux Server Manager — Debian server provisioning
           erp24 provisiona servidores Debian de forma idempotente:
           UFW, SSH hardening, Docker rootless, fail2ban, unattended-upgrades,
           systemd-timesyncd, sysctl, hostname.
           Corre 'sudo erp24' para o menu interativo ou usa subcomandos
           (validate, add-ip, remove-ip, ...).
          EOF

          # postinst — distingue install fresco vs upgrade
          cat > "$PKG/DEBIAN/postinst" <<'POST'
          #!/bin/bash
          set -e

          ACTION="${1:-configure}"
          OLD_VERSION="${2:-}"

          mkdir -p /etc/erp24
          chmod 755 /etc/erp24

          # Os ficheiros do package (binário, config.example.yaml, README) já foram
          # copiados pelo dpkg neste ponto. config.yaml e state.yaml não são
          # geridos pelo package → preservados em upgrades.

          echo
          echo "============================================"
          if [ -n "$OLD_VERSION" ]; then
            echo "  erp24 atualizado: ${OLD_VERSION} → __VERSION__"
          else
            echo "  erp24 instalado (versão __VERSION__)"
          fi
          echo "============================================"
          echo "  Binário:    /usr/sbin/erp24"
          echo "  Config:     /etc/erp24/config.yaml          (preservado em upgrades)"
          echo "  Exemplo:    /etc/erp24/config.example.yaml  (atualizado p/ esta versão)"
          echo "  State:      /etc/erp24/state.yaml           (gerido pelo erp24)"
          echo "  Docs:       /usr/share/doc/erp24/README.md"
          echo

          if [ -n "$OLD_VERSION" ]; then
            if [ -f /etc/erp24/config.yaml ]; then
              echo "  Para ver mudanças no schema desde a versão antiga:"
              echo "    diff /etc/erp24/config.yaml /etc/erp24/config.example.yaml"
              echo
              echo "  Validar setup atual:"
              echo "    sudo erp24 validate"
            fi
          else
            echo "  Próximo passo:"
            echo "    sudo erp24   (sem config → wizard arranca automaticamente)"
          fi
          echo
          POST

          # Substitui placeholder __VERSION__ pela versão real
          sed -i "s/__VERSION__/${VERSION}/g" "$PKG/DEBIAN/postinst"
          chmod 755 "$PKG/DEBIAN/postinst"

          # prerm — limpeza opcional ao remover (não toca em config)
          cat > "$PKG/DEBIAN/prerm" <<'PRERM'
          #!/bin/bash
          set -e
          # Não removemos /etc/erp24/* — config + state ficam.
          # Para purga total: sudo apt purge erp24 && sudo rm -rf /etc/erp24
          PRERM
          chmod 755 "$PKG/DEBIAN/prerm"

          dpkg-deb --build --root-owner-group "$PKG"
          ls -lh "${PKG}.deb"

          # alias versionless → permite URL "releases/latest/download/erp24_<arch>.deb"
          cp "${PKG}.deb" "erp24_${ARCH}.deb"
          ls -lh "erp24_${ARCH}.deb"

          # validar
          dpkg-deb --info "${PKG}.deb"
          dpkg-deb --contents "${PKG}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            erp24_${{ inputs.version }}_${{ matrix.arch }}.deb
            erp24_${{ matrix.arch }}.deb
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (${{ github.ref_name }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # tags + history para release notes

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create tag + release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.ref_name }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: artifacts/*.deb
          fail_on_unmatched_files: true
          body: |
            ## Install / Upgrade (latest)

            ```bash
            ARCH=$(dpkg --print-architecture)
            rm -f erp24_*.deb                     # crítico: senão apt instala o antigo
            wget -O erp24_${ARCH}.deb \
              https://github.com/${{ github.repository }}/releases/latest/download/erp24_${ARCH}.deb
            sudo apt install -y ./erp24_${ARCH}.deb
            sudo erp24
            ```

            > ⚠️ `wget` sem `-O` cria `erp24_amd64.deb.1` quando já existe um download
            > anterior, e `apt install` instala o **antigo** que ficou em disco.
            > Por isso o `rm -f` + `-O`.

            ## Install (esta versão específica)

            ```bash
            ARCH=$(dpkg --print-architecture)
            rm -f erp24_*.deb
            wget -O erp24_${{ inputs.version }}_${ARCH}.deb \
              https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/erp24_${{ inputs.version }}_${ARCH}.deb
            sudo apt install -y ./erp24_${{ inputs.version }}_${ARCH}.deb
            ```

            ## Upgrade

            Mesmo comando do bloco "Install / Upgrade (latest)" acima.
            `config.yaml` + `state.yaml` preservados. `config.example.yaml`
            é atualizado para refletir o schema desta versão.

            ## Locations

            - Binário: `/usr/sbin/erp24`
            - Config:  `/etc/erp24/config.yaml`
            - State:   `/etc/erp24/state.yaml`
