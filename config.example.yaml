# erp24 config — intent / preferences only.
# Does NOT contain secrets (passwords are prompted at runtime).
# Does NOT contain UFW whitelist (derived from the firewall itself).

# Schema version of this file. Bumped by erp24 when the YAML layout changes.
# Files without this key are treated as legacy (v0): erp24 forces all optional
# modules to true so old installs don't silently lose modules.
schema_version: 1

timezone: Etc/UTC

# Hostname is optional. Empty → hostname module won't run.
hostname: srv01
fqdn: srv01.example.com

ssh:
  # Alternative port (reduces automated brute-force).
  port: 2210
  # Non-root admin user. Password is prompted when the user is created;
  # nothing is stored on disk.
  user: dev24

network:
  # Policy for modules that need to open UFW ports:
  #   ask   → prompt each time (recommended)
  #   true  → open automatically
  #   false → never open (manual UFW management)
  auto_open_ports: ask

# Sentinel monitoring agent (opt-in module below). Only the central URL lives
# here — the install key is asked at install time and the agent token is written
# to /etc/sentinel/agent.toml. Neither secret is ever stored in this file.
sentinel:
  central_url: https://sentinel.erp24.pt

# Which optional modules to install on `erp24 all` and on the post-wizard run.
# firewall and ssh are always enabled (security baseline). The rest reflect
# wizard answers and can be edited here later.
modules:
  firewall: true     # always true
  ssh: true          # always true
  sysctl: true
  timesync: true
  hostname: true
  docker: true
  fail2ban: true
  upgrades: true
  sentinel: false    # opt-in: installs + enrols the Sentinel monitoring agent
